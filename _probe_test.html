<!DOCTYPE html><html><head><meta charset="UTF-8"><title>probe</title></head><body>
<div id="out">running</div>
<script>
var LOG=[]; var ERR=[];
window.addEventListener('error',function(e){ERR.push(e.message+'@'+e.lineno);});
function chk(n,ok,x){LOG.push((ok?'[OK] ':'[ERR] ')+n+(x?' — '+x:''));}
window.addEventListener('load', function(){
  var D=window.__recordDebug;
  try{
    // ① URL 参数是否写入 localStorage
    var ep=localStorage.getItem('wc_sync_endpoint');
    var tk=localStorage.getItem('wc_sync_token');
    chk('endpoint 已由URL参数写入', !!ep, ep||'(空)');
    chk('token 哈希已由URL参数写入', !!tk, tk?tk.slice(0,16)+'...':'(空)');
    chk('明文口令未落盘', localStorage.getItem('wc_sync_token_plain')===null && !JSON.stringify(localStorage).includes('REDACTED'), '确认无明文');
    // ② 模式应为 cloud（自动绑定，无需弹窗）
    var st=D.syncStatus();
    chk('模式=cloud（打开即绑定，无需人工操作）', st.mode==='cloud', st.mode);
    // ③ 绑定弹窗是否默认隐藏
    chk('绑定弹窗未弹出', document.getElementById('bindMask').style.display==='none', document.getElementById('bindMask').style.display);
    // ④ 录入界面零同步字样
    var words=['同步','上传','云端','备份','飞书','团队表格'];
    var bad=[];
    var head=document.querySelector('.page-head');
    var entry=document.querySelector('.block-orange');
    var table=document.querySelector('.rec-table');
    var btnArea=document.querySelectorAll('.block .btn-row');
    words.forEach(function(w){
      if(head.textContent.indexOf(w)>=0) bad.push('标题栏:'+w);
      if(entry.textContent.indexOf(w)>=0) bad.push('录入区:'+w);
      if(table.textContent.indexOf(w)>=0) bad.push('记录表:'+w);
    });
    for(var i=0;i<btnArea.length;i++){ var t=btnArea[i].textContent; words.forEach(function(w){ if(t.indexOf(w)>=0) bad.push('按钮区:'+w); }); }
    chk('录入全过程零同步字样', bad.length===0, bad.length?bad.join(','):'无');
    // ⑤ 逐人录入（真实纸表数据）
    function setv(id,v){var e=document.getElementById(id);e.value=v;e.dispatchEvent(new Event('input'));}
    setv('fRecorder','E2E牌友'); document.getElementById('fRecorder').dispatchEvent(new Event('change'));
    var people=[['E2E甲',10000,7,5,0],['E2E乙',118000,7,59,0],['E2E丙',322000,7,161,0]];
    var pass=0;
    people.forEach(function(c){
      setv('recName',c[0]);
      setv('c10w',''); setv('c5w',''); setv('c5000','');
      setv('c1w',Math.floor(c[1]/10000)||''); var rem=c[1]%10000;
      setv('c1000',Math.floor(rem/1000)||''); rem%=1000;
      setv('c500',Math.floor(rem/500)||''); rem%=500;
      setv('c100',rem||'');
      setv('recCards',c[2]);
      var pts=parseInt(document.getElementById('calcPoints').textContent,10);
      if(pts===c[3]) pass++;
      document.getElementById('btnNext').click();
    });
    chk('纸表计算正确', pass===3, pass+'/3');
    // ⑥ 录入中界面仍无同步字样（录入后再查一次）
    var bad2=[];
    var bodyTxt=document.body.innerText;
    words.forEach(function(w){ if(bodyTxt.indexOf(w)>=0) bad2.push(w); });
    chk('录入后仍无同步字样', bad2.length===0, bad2.length?bad2.join(','):'无');
  }catch(e){ LOG.push('[FATAL] '+e.message); }
  // ⑦ 等推送完成
  setTimeout(function(){
    try{
      var st2=D.syncStatus();
      LOG.push('[INFO] 推送后状态: '+JSON.stringify(st2));
      chk('队列已清空（推送成功）', st2.pending===0, 'pending='+st2.pending);
      chk('无同步错误', !st2.error, st2.error||'无');
      LOG.push('[INFO] JS错误: '+(ERR.length?ERR.join(';'):'无'));
    }catch(e){LOG.push('[FATAL2] '+e.message);}
    document.getElementById('out').textContent=LOG.join(' ## ');
    document.title=LOG.join(' ## ');
  }, 12000);
});
</script></body></html>
